# Alembic configuration. See TICKET-004.
#
# The database URL is NOT here: it comes from Settings (app.config) so that
# credentials live in exactly one place. See alembic/env.py.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Revision filenames sort by the order they were created.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# NOTE: sqlalchemy.url is intentionally empty; env.py sets it.

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
